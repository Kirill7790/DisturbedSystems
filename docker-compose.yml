services:
  # Master
  postgres:
    image: postgres:16-alpine
    container_name: travel_planner_master
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_db
      POSTGRES_HOST_AUTH_METHOD: "trust"

      REPLICATION_USER: repuser
      REPLICATION_PASSWORD: rep_pass

    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

      - ./db/migrations/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/replications/physical/01_create_repuser.sh:/docker-entrypoint-initdb.d/02-create_repuser.sh:ro
      - ./db/replications/physical/02_pg_hba.sh:/docker-entrypoint-initdb.d/03-pg_hba.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Replica
  postgres_sub:
    image: postgres:16-alpine
    container_name: travel_planner_replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_db

      REPLICATION_USER: repuser
      REPLICATION_PASSWORD: rep_pass
      PGPASSWORD: rep_pass

    ports:
      - "127.0.0.1:55432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./db/replications/physical/03_replica_entrypoint.sh:/usr/local/bin/replica_entrypoint.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d travel_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    entrypoint: ["/bin/bash", "/usr/local/bin/replica_entrypoint.sh"]
    command: ["postgres", "-c", "hot_standby=on"]

  # PgCat
  pgcat:
    image: ghcr.io/postgresml/pgcat:latest
    container_name: travel_planner_pgcat
    volumes:
      - ./pgcat.toml:/etc/pgcat/pgcat.toml:ro
    ports:
      - "127.0.0.1:6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_sub:
        condition: service_healthy
    restart: unless-stopped

  # API
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      pgcat:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@pgcat:6432/travel_db
      DB_POOL_MIN: 2
      DB_POOL_MAX: 90
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_replica_data: