networks:
  travel_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:

  # Node 0: db_0..db_3
  postgres_00:
    image: postgres:16-alpine
    container_name: postgres_00
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata_00:/var/lib/postgresql/data
      - ./db/shards/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db/shards/init_node_00.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - travel_net

  # Node 1: db_4..db_7
  postgres_01:
    image: postgres:16-alpine
    container_name: postgres_01
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata_01:/var/lib/postgresql/data
      - ./db/shards/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db/shards/init_node_01.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - travel_net

  # Node 2: db_8..db_b
  postgres_02:
    image: postgres:16-alpine
    container_name: postgres_02
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata_02:/var/lib/postgresql/data
      - ./db/shards/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db/shards/init_node_02.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - travel_net

  # Node 3: db_c..db_f
  postgres_03:
    image: postgres:16-alpine
    container_name: postgres_03
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata_03:/var/lib/postgresql/data
      - ./db/shards/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./db/shards/init_node_03.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - travel_net

  # API
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./mapping.json:/app/mapping.json
    depends_on:
      postgres_00:
        condition: service_healthy
      postgres_01:
        condition: service_healthy
      postgres_02:
        condition: service_healthy
      postgres_03:
        condition: service_healthy
    environment:
      SHARDS_USER: postgres
      SHARDS_PASSWORD: postgres
      DB_POOL_MIN: 1
      DB_POOL_MAX: 10
    networks:
      - travel_net

volumes:
  pgdata_00:
  pgdata_01:
  pgdata_02:
  pgdata_03: